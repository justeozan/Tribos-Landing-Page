<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Tribos - carte sociale</title>
    <!--
      Gabarit de la carte Open Graph (1200x630). Rendu par tools/build-og.mjs
      dans un Chromium headless, pour réutiliser les vraies polices et les vrais
      tokens du site plutôt que de recomposer la marque à la main.
      Régénérer avec : node tools/build-og.mjs

      Preset Cinematic 3D, comme le hero de la page d'accueil : le plan du
      sentier (renard canonique au coucher du soleil), le texte en HTML sur un
      voile sombre à gauche, jamais dans l'image.
    -->
    <link rel="stylesheet" href="../assets/fonts/fonts.css" />
    <link rel="stylesheet" href="../assets/css/tribos.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--night-0);
      }

      body::before {
        display: none;
      }

      .card {
        position: relative;
        isolation: isolate;
        display: grid;
        align-content: center;
        width: 1200px;
        height: 630px;
        padding: 0 72px;
        overflow: hidden;
      }

      /* The fox sits right of centre; the crop keeps its head, its wave and
         its tail inside the frame, and the sun-lit left goes under the veil. */
      .card .scene-media img {
        object-position: 70% 22%;
      }

      .card::before,
      .card::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
      }

      .card::before {
        background: linear-gradient(
          90deg,
          rgb(10 16 20 / 0.94) 0%,
          rgb(10 16 20 / 0.86) 30%,
          rgb(10 16 20 / 0.5) 46%,
          transparent 62%
        );
      }

      .card::after {
        background: linear-gradient(0deg, rgb(10 16 20 / 0.7) 0%, transparent 34%);
      }

      .lockup {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 44px;
      }

      .lockup img {
        width: 60px;
        height: 60px;
        border-radius: 17px;
        box-shadow: 0 8px 26px rgb(243 115 10 / 0.35);
      }

      .lockup span {
        font-family: var(--font-display);
        font-size: 38px;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: var(--ivory);
      }

      .card h1 {
        font-size: 92px;
        line-height: 0.95;
        letter-spacing: -0.047em;
        margin-bottom: 30px;
      }

      .card h1 .l {
        display: block;
      }

      .card .eyebrow {
        margin: 0;
        font-size: 19px;
        letter-spacing: 0.14em;
        color: rgb(255 246 236 / 0.88);
      }

      .card .eyebrow .pulse {
        width: 11px;
        height: 11px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <picture class="scene-media">
        <source type="image/avif" srcset="../assets/cine/sentier-1920.avif" />
        <img src="../assets/cine/sentier-1920.jpg" width="1920" height="1280" alt="" />
      </picture>

      <div class="lockup">
        <img src="../assets/brand/tribos-icon.png" alt="" />
        <span>Tribos</span>
      </div>
      <h1>
        <span class="l">Le sport,</span>
        <span class="l">mais avec</span>
        <span class="l"><em class="lit">tes potes.</em></span>
      </h1>
      <p class="eyebrow eyebrow-live">
        <span class="pulse" aria-hidden="true"></span>
        Bêta privée&#8239;· Android et iPhone
      </p>
    </div>
  </body>
</html>
